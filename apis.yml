aid: national-interagency-fire-center
name: National Interagency Fire Center
description: >-
  The National Interagency Fire Center (NIFC) is a collaborative effort between multiple federal agencies to address
  wildfires and other emergency incidents around the United States. NIFC serves as a centralized command center for
  coordinating resources, personnel, and information to effectively respond to and manage wildfires. NIFC publishes
  authoritative geospatial data through ArcGIS REST services and its open data portal.
